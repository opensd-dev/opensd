# OpenSD tutorial regression benchmark data.
# This file is test data, not executable code. Keep metadata with values so the source, units, and tolerance are reviewable.
# For time_checks, either use parallel times/expected arrays or [[time_checks.points]] rows.
# Point rows may include enabled = false and reason = "..." to preserve values that are intentionally excluded.
format_version = 1

[benchmark]
id = "tutorial13"
source = "PINET-tests reference values migrated from the previous pytest constants."
independent_variable = "time"
independent_units = "s"

[[profile_checks]]
quantity = "temperature"
native_units = "K"
comparison_note = "actual values are transformed as actual * scale + offset before comparison"
row = "first"
row_note = "PINET test_case13 checks the steady-state axial sodium profile before transient execution; in OpenSD output.res this is the first row."
columns = ["ttemp_gues:node1", "ttemp_gues:pipe1_node0", "ttemp_gues:pipe1_node1", "ttemp_gues:pipe1_node2", "ttemp_gues:pipe1_node3", "ttemp_gues:pipe1_node4", "ttemp_gues:pipe1_node5", "ttemp_gues:pipe1_node6", "ttemp_gues:pipe1_node7", "ttemp_gues:pipe1_node8", "ttemp_gues:node2"]

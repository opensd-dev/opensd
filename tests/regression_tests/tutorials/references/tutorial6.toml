# OpenSD tutorial regression benchmark data.
# This file is test data, not executable code. Keep metadata with values so the source, units, and tolerance are reviewable.
# For time_checks, either use parallel times/expected arrays or [[time_checks.points]] rows.
# Point rows may include enabled = false and reason = "..." to preserve values that are intentionally excluded.
format_version = 1

[benchmark]
id = "tutorial6"
source = "PINET-tests test_ht.py::test_case6 steady IHX reference value."
independent_variable = "time"
independent_units = "s"

[[time_checks]]
quantity = "node2 outlet static temperature"
native_units = "K"
comparison_note = "PINET unittest compares circuits[0].nodes[1].stemp_gues - 273.0 against 396.13 degC. OpenSD output.res records ttemp_gues; the kinetic correction is negligible for this case."
column = "ttemp_gues:node2"
offset = -273.0
decimal = 2
comparison_units = "degC"

[[time_checks.points]]
time = 0
expected = 396.13
enabled = true

[[time_checks]]
quantity = "node2 outlet temperature transient"
native_units = "K"
comparison_note = "PINET tutorial6 transient run sampled from ttemp_gues:node2 with the same -273.0 degC convention used by PINET-tests."
column = "ttemp_gues:node2"
offset = -273.0
decimal = 2
comparison_units = "degC"

